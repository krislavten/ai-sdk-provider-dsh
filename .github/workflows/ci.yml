name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "ai-v6"
            ai: "^6.0.116"
            provider: "^3.0.8"
            provider-utils: "^4.0.19"
          - name: "ai-v7"
            ai: "^7.0.0"
            provider: "^4.0.0"
            provider-utils: "^5.0.0"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install base deps
        run: pnpm install --frozen-lockfile
      - name: Override AI SDK majors (${{ matrix.name }})
        run: |
          pnpm add -D ai@${{ matrix.ai }} @ai-sdk/provider@${{ matrix.provider }} @ai-sdk/provider-utils@${{ matrix.provider-utils }}
      - name: Typecheck
        run: pnpm run check
      - name: Lint
        run: pnpm run lint
      - name: Build
        run: pnpm run build
      - name: Package lint (publint)
        run: pnpm exec publint
      - name: Unit tests
        run: pnpm exec vitest run tests/event-mapper.test.ts tests/errors.test.ts tests/language-model.test.ts
      - name: E2E (keyless replay: real dsh runtime + recorded fixtures)
        run: pnpm exec vitest run tests/replay-e2e.test.ts tests/replay-multi-e2e.test.ts tests/e2e.test.ts
